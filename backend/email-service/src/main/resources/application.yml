server:
  port: 8088

spring:
  application:
    name: email-service
  config:
    import: "optional:configserver:${CONFIG_SERVICE_URI:http://localhost:8080}"

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:choresync@gmail.com}
    # Gmail app password, injected from the choreshare-secrets Secret / .env
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
