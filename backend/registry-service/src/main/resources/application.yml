server:
  port: 8761

spring:
  application:
    name: registry-service
  security:
    user:
      # Clients put these in their defaultZone URL:
      # http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@<host>:8761/eureka
      name: ${EUREKA_USERNAME}
      password: ${EUREKA_PASSWORD}

eureka:
  server:
    peer-node-read-timeout-ms: 10000
  instance:
    hostname: ${HOSTNAME:localhost}.eureka
  client:
    registerWithEureka: false
    fetchRegistry: false
