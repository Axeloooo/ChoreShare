---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: email-service-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: email-service-app
  template:
    metadata:
      labels:
        app: email-service-app
    spec:
      initContainers:
        - name: wait-for-config-service
          image: busybox
          command:
            [
              "sh",
              "-c",
              'until nc -z config-service-svc 80; do echo "Waiting for Config Service"; sleep 2; done',
            ]
      containers:
        - name: email-service-app
          image: axeloooo/email-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8088
          env:
            - name: EUREKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: choreshare-secrets
                  key: EUREKA_USERNAME
            - name: EUREKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: choreshare-secrets
                  key: EUREKA_PASSWORD
            - name: REGISTRY_SERVICE_URI
              value: http://$(EUREKA_USERNAME):$(EUREKA_PASSWORD)@eureka-svc:8761/eureka
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: choreshare-secrets
                  key: MAIL_USERNAME
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: choreshare-secrets
                  key: MAIL_PASSWORD
            - name: CONFIG_SERVICE_URI
              valueFrom:
                configMapKeyRef:
                  name: config-cm
                  key: CONFIG_SERVICE_URI
            - name: ZIPKIN_SERVICE_URI
              valueFrom:
                configMapKeyRef:
                  name: zipkin-cm
                  key: ZIPKIN_SERVICE_URI

---
apiVersion: v1
kind: Service
metadata:
  name: email-service-svc
spec:
  selector:
    app: email-service-app
  ports:
    - port: 80
      targetPort: 8088
