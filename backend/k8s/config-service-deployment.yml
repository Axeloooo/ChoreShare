---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: config-service-app
  template:
    metadata:
      labels:
        app: config-service-app
    spec:
      initContainers:
        - name: wait-for-eureka
          image: busybox
          command:
            [
              "sh",
              "-c",
              'until nc -z eureka-svc 8761; do echo "Waiting for Eureka"; sleep 2; done',
            ]
      containers:
        - name: config-service-app
          image: axeloooo/config-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: EUREKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: choreshare-secrets
                  key: EUREKA_USERNAME
            - name: EUREKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: choreshare-secrets
                  key: EUREKA_PASSWORD
            - name: REGISTRY_SERVICE_URI
              value: http://$(EUREKA_USERNAME):$(EUREKA_PASSWORD)@eureka-svc:8761/eureka

---
apiVersion: v1
kind: Service
metadata:
  name: config-service-svc
spec:
  selector:
    app: config-service-app
  ports:
    - port: 80
      targetPort: 8080
